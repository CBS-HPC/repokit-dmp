name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CBS-HPC/repokit-common
          path: repokit-common
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ./repokit-common
      - run: pip install -e . --no-deps
      - run: pip install requests PyYAML nbformat jsonschema dirhash streamlit pytest "ruff>=0.6" "mypy>=1.10" types-requests uv
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
