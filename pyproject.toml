[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repokit-dmp"
version = "0.1"
description = "Data management plan tools for Repokit"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "CBS-HPC"}]
keywords = ["research", "reproducibility", "automation", "data-management"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "requests",
  "PyYAML",
  "nbformat",
  "jsonschema",
  "dirhash",
  "streamlit",
  "repokit-common",
]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/CBS-HPC/repokit-dmp"
Repository = "https://github.com/CBS-HPC/repokit-dmp"
Issues = "https://github.com/CBS-HPC/repokit-dmp/issues"


[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "uv",
]
editor = [
  "wxPython>=4.2; platform_system == 'Windows' or platform_system == 'Darwin'",
]
[project.scripts]
repokit-dmp = "repokit_dmp.cli:main"
set-dataset = "repokit_dmp.dataset:main"
dcas-migration = "repokit_dmp.dcas:main"
dmp-update = "repokit_dmp.dmp:main"
dmp-editor = "repokit_dmp.editor:cli"
dmp-init = "repokit_dmp.init:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI stable across Ruff releases and enforce the project's baseline checks.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
# Type-check this package against its declared Python floor without parsing
# implementation stubs from transitive dependencies such as NumPy.
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
exclude = '(^\.venv/|^build/|^dist/)'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.datasets]
patterns = "data/*"
